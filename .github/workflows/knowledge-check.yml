name: Validate source knowledge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/publish-knowledge.mjs --validate
      - run: node --test scripts/check-knowledge.mjs

      - name: Verify bot data queries and HTTP/Discord routing
        run: node --test test/bot-data.test.js test/project-help.test.js

      - name: Verify WoWAudit answers and loot counts
        run: node --test test/agent.test.js test/result-format.test.js test/loot-ranking.test.js
